<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon.svg?v=1"
        />
        <link rel="apple-touch-icon" href="/favicon.svg?v=1" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="VaptFix is a Vulnerability Management Program as a service. Discover, prioritize, and fix security flaws fast with guided remediation."
        />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />

        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
            rel="stylesheet"
        />

        <!-- Bootstrap CSS (JS bundle is imported in main.ts) -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- Bootstrap Icons -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        />

        <!-- Google reCAPTCHA (explicit render for modal widgets) -->
        <script
            src="https://www.google.com/recaptcha/api.js?render=explicit"
            async
            defer
        ></script>

        <!-- Google Sign In -->
        <script
            src="https://accounts.google.com/gsi/client"
            async
            defer
        ></script>

        <title>VaptFix</title>
        <script>
            (function () {
                function dropBad(storage, key) {
                    try {
                        var raw = storage.getItem(key);
                        if (!raw) return;
                        JSON.parse(raw);
                    } catch (e) {
                        try {
                            storage.removeItem(key);
                        } catch (e2) {}
                    }
                }
                try {
                    dropBad(sessionStorage, "user");
                    dropBad(sessionStorage, "authenticated");
                    dropBad(localStorage, "user");
                    dropBad(localStorage, "authenticated");
                    dropBad(localStorage, "completedSteps");
                } catch (e) {}
            })();
        </script>
    </head>
    <body data-bs-theme="light">
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
